name: VM Trade build and release checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build the mod
        run: bash gradlew --no-daemon clean build verifyJar

      - name: Test server transaction guard invariants
        run: |
          mkdir -p build/guard-test-classes
          javac --release 21 -cp "build/classes/java/main:build/api-stubs.jar" -d build/guard-test-classes tooling/tests/TransactionGuardTest.java
          java -cp "build/guard-test-classes:build/classes/java/main:build/api-stubs.jar" com.puzzlechannel.vmtrade.TransactionGuardTest

      - name: Verify release structure
        run: |
          python tooling/verify_static.py
          python tooling/verify_release.py
          python tooling/verify_safety.py

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: VMTrade-\${{ github.sha }}
          path: build/libs/vm-trade-*.jar
          if-no-files-found: error
