name: VM Trade build and release checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build the mod
        run: bash gradlew --no-daemon clean build verifyJar

      - name: Verify release structure
        run: |
          python tooling/verify_static.py
          python tooling/verify_release.py
          python tooling/verify_safety.py

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: VMTrade-${{ github.sha }}
          path: build/libs/vm-trade-*.jar
          if-no-files-found: error
      - name: Inspect upstream market screen symbols for targeted regression fixes
        if: github.ref != ''
        run: |
          javap -classpath vendor/open-trade-1.4.2.jar -p net.onlyjugs.client.screen.MarketScreen
          javap -classpath vendor/open-trade-1.4.2.jar -c -p net.onlyjugs.client.screen.MarketScreen | grep -n -E -A45 -B12 'Back|Sell Orders|Recent Trades' || true

          javap -classpath vendor/open-trade-1.4.2.jar -c -p net.onlyjugs.client.screen.MarketScreen | awk '/lambda\\$buildOurWidgets\\$0\\(/,/lambda\\$buildOurWidgets\\$1\\(/'
          javap -classpath vendor/open-trade-1.4.2.jar -c -p net.onlyjugs.client.screen.MarketScreen | awk '/private void renderRightPanel\\(/,/private java.lang.String fit\\(/'
          echo '--- Relevant upstream classes ---'
          jar tf vendor/open-trade-1.4.2.jar | grep -E 'net/onlyjugs/client/screen/.*class|BackTo.*Payload.class|net/onlyjugs/net/OpenTradeNet.class' || true
          echo '--- Server handler for BackToTradeChestPayload ---'
          javap -classpath vendor/open-trade-1.4.2.jar -c -p net.onlyjugs.net.OpenTradeNet | grep -n -E -A45 -B12 'BackToTradeChestPayload|handleBackToTradeChest' || true
